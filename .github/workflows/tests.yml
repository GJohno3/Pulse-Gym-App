# Runs the full test suite on every push and pull request, so a change that breaks the app is caught
# before it reaches Netlify.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check site/styles.css matches index.html
        run: npm run build && git diff --exit-code site/styles.css

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Keep screenshots when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tests/output/
          retention-days: 7
